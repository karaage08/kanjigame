let currentLevel="";
let currentQuestion=null;
let correct=0;
let total=0;
let wrongPool=[];
let questionPool=[];
let answered=true;

function updateClock(){
document.getElementById("clock").innerText=
new Date().toLocaleString("ja-JP");
}

setInterval(updateClock,1000);
updateClock();

function getBest(level){
return JSON.parse(
localStorage.getItem("best_"+level)
|| '{"rate":0}'
);
}

function saveBest(level,rate){
const old=getBest(level);

if(rate>old.rate){
localStorage.setItem(
"best_"+level,
JSON.stringify({
rate:rate
})
);
}
}

function showBest(){

let html="<h3>ベスト正答率</h3>";

["10","8","6","3"].forEach(level=>{

const best=getBest(level);

html +=
"<p>"+level+
"級 : "+
best.rate+
"%</p>";

});

document.getElementById("bestArea")
.innerHTML=html;

document.getElementById("resultBest")
.innerHTML=html;

}

function startGame(level){

currentLevel=level;

correct=0;
total=0;
wrongPool=[];

questionPool=[...questions[level]];

document.getElementById("correctCount")
.innerText="0";

document.getElementById("startScreen")
.classList.add("hidden");

document.getElementById("resultScreen")
.classList.add("hidden");

document.getElementById("gameScreen")
.classList.remove("hidden");

document.getElementById("levelTitle")
.innerText=
"漢検"+level+"級";

nextQuestion();

}

function nextQuestion(){

answered=false;

let pool;

if(
wrongPool.length>0 &&
Math.random()<0.35
){
pool=wrongPool;
}else{
pool=questionPool;
}

currentQuestion=
pool[
Math.floor(
Math.random()*pool.length
)
];

document.getElementById("question")
.innerText=currentQuestion.word;

document.getElementById("answerBox")
.value="";

document.getElementById("message")
.innerHTML="";

document.getElementById("answerBox")
.focus();

}

function submitAnswer(){

if(answered){
return;
}

answered=true;

total++;

const user=
document.getElementById("answerBox")
.value
.trim();

if(user===currentQuestion.reading){

correct++;

document.getElementById("message")
.innerHTML=
"<p class='correct'>○ 正解！</p>";

}else{

wrongPool.push(currentQuestion);

document.getElementById("message")
.innerHTML=
"<p class='wrong'>× 正解は "
+currentQuestion.reading+
"</p>";

}

document.getElementById("correctCount")
.innerText=correct;

if(correct>=10){

finishGame();

return;

}

setTimeout(
nextQuestion,
800
);

}

document
.getElementById("answerBox")
.addEventListener(
"keydown",
function(e){

if(e.key==="Enter"){

submitAnswer();

}

}
);

function finishGame(){

let rate=
Math.round(
correct/total*100
);

saveBest(
currentLevel,
rate
);

document.getElementById("gameScreen")
.classList.add("hidden");

document.getElementById("resultScreen")
.classList.remove("hidden");

document.getElementById("resultText")
.innerHTML=
"10問正解まで "+
total+
"問";

document.getElementById("resultRate")
.innerHTML=
"<h3>正答率 "
+rate+
"%</h3>";

showBest();

}

function backToStart(){

document.getElementById("resultScreen")
.classList.add("hidden");

document.getElementById("startScreen")
.classList.remove("hidden");

showBest();

}

showBest();
